<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoption Application</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🐾 FurEver Home</h1>
</header>

<div class="form-container">

    <h2>Adoption Application ❤️</h2>

    <form onsubmit="submitApplication(event)">

        <label>Pet Name</label>
        <input type="text" id="petName" placeholder="Enter pet name" required>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Contact Number</label>
        <input type="text" placeholder="Enter contact number" required>

        <label>Address</label>
        <input type="text" placeholder="Enter your address" required>

        <label>Reason for Adoption</label>
        <textarea placeholder="Why do you want to adopt this pet?" required></textarea>

        <button type="submit">Submit Application</button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
